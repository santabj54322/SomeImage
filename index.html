<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>bop bop</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* 빈 공간을 채울 배경색 (검은색) */
            overflow: hidden; /* 스크롤바 방지 */
            touch-action: none; /* 모바일에서 화면 스크롤, 줌인 방지 */
            user-select: none; /* 텍스트 및 이미지 선택 방지 */
            -webkit-user-select: none;
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* 비율을 유지하며 화면에 꽉 차게 표시 */
            pointer-events: none; /* 이미지가 클릭 이벤트를 방해하지 않도록 설정 */
            visibility: hidden; /* 기본적으로 숨김 처리 */
        }

        /* 기본 상태: 이미지 1 표시 */
        body:not(.active) #img1 {
            visibility: visible;
        }

        /* 클릭된 상태: 이미지 2 표시 */
        body.active #img2 {
            visibility: visible;
        }
        
        #counter {
            position: absolute;
            top: 20px; /* 화면 위쪽에서 20px 띄움 */
            left: 50%;
            transform: translateX(-50%); /* 정확히 가운데 정렬 */
            color: #ffffff; /* 텍스트 색상 */
            font-size: 4rem; /* 텍스트 크기 */
            font-weight: bold;
            font-family: Arial, sans-serif;
            z-index: 10; /* 이미지 위로 올라오도록 설정 */
            pointer-events: none; /* 텍스트 위를 클릭해도 화면 클릭으로 인식되도록 설정 */
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7); /* 밝은 이미지 위에서도 잘 보이도록 그림자 추가 */
        }
    </style>
</head>
<body>
    <div id="counter">0</div>
    <div class="image-container">
        <img id="img1" src="image1.jpg" alt="기본 이미지">
        <img id="img2" src="image2.jpg" alt="클릭 시 이미지">
    </div>

    <script>
        const body = document.body;
        const counterEl = document.getElementById('counter');
        let clickCount = 0; // 카운트 저장 변수

        // 화면 누르기 시작 (마우스 클릭 & 모바일 터치)
        const activate = (e) => {
            if (e.cancelable) e.preventDefault(); 
            
            if (!body.classList.contains('active')) {
                clickCount++;
                counterEl.textContent = clickCount;
            }
            body.classList.add('active');
        };

        // 화면 누르기 해제 (마우스 떼기 & 모바일 터치 끝)
        const deactivate = (e) => {
            if (e.cancelable) e.preventDefault();
            body.classList.remove('active');
        };

        // PC 마우스 이벤트
        window.addEventListener('mousedown', activate);
        window.addEventListener('mouseup', deactivate);
        window.addEventListener('mouseleave', deactivate); // 마우스가 브라우저 창 밖으로 나갈 때 대비

        // 모바일 터치 이벤트
        window.addEventListener('touchstart', activate, { passive: false });
        window.addEventListener('touchend', deactivate, { passive: false });
        window.addEventListener('touchcancel', deactivate, { passive: false });
    </script>
</body>
</html>
