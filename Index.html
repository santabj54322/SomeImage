<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>bop bop</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* 빈 공간을 채울 배경색 (검은색) */
            overflow: hidden; /* 스크롤바 방지 */
            touch-action: none; /* 모바일에서 화면 스크롤, 줌인 방지 */
            user-select: none; /* 텍스트 및 이미지 선택 방지 */
            -webkit-user-select: none;
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* 비율을 유지하며 화면에 꽉 차게 표시 */
            pointer-events: none; /* 이미지가 클릭 이벤트를 방해하지 않도록 설정 */
            visibility: hidden; /* 기본적으로 숨김 처리 */
        }

        /* 기본 상태: 이미지 1 표시 */
        body:not(.active) #img1 {
            visibility: visible;
        }

        /* 클릭된 상태: 이미지 2 표시 */
        body.active #img2 {
            visibility: visible;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img id="img1" src="image1.jpg" alt="기본 이미지">
        <img id="img2" src="image2.jpg" alt="클릭 시 이미지">
    </div>

    <script>
        const body = document.body;

        // 화면 누르기 시작 (마우스 클릭 & 모바일 터치)
        const activate = (e) => {
            if (e.cancelable) e.preventDefault(); 
            body.classList.add('active');
        };

        // 화면 누르기 해제 (마우스 떼기 & 모바일 터치 끝)
        const deactivate = (e) => {
            if (e.cancelable) e.preventDefault();
            body.classList.remove('active');
        };

        // PC 마우스 이벤트
        window.addEventListener('mousedown', activate);
        window.addEventListener('mouseup', deactivate);
        window.addEventListener('mouseleave', deactivate); // 마우스가 브라우저 창 밖으로 나갈 때 대비

        // 모바일 터치 이벤트
        window.addEventListener('touchstart', activate, { passive: false });
        window.addEventListener('touchend', deactivate, { passive: false });
        window.addEventListener('touchcancel', deactivate, { passive: false });
    </script>
</body>
</html>
